<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVS Telegram Album</title>
<style>
  :root{
    /* synced với full-palette-v2 */
    --accent:#2563EB;
    --accent-soft:#EEF2FF;
    --amber:#D97706;
    --amber-soft2:#FEF3C7;
    --ink:#0F172A;
    --muted:#64748B;
    --faint:#94A3B8;
    --line:#E2E8F0;
    --bg:#F8FAFC;
    --card:#FFFFFF;
    --shadow-sm:0 8px 24px -18px rgba(15,23,42,.34);
    --display:"Bahnschrift","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:Calibri,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);
    line-height:1.58;-webkit-font-smoothing:antialiased;padding-bottom:48px;}
  .wrap{max-width:460px;margin:0 auto;padding:0 16px;}
  .back{display:inline-block;margin:20px 0 0;font-size:14px;font-weight:700;color:var(--accent);text-decoration:none;}
  h1{font-family:var(--display);font-size:28px;margin:12px 0 4px;font-weight:700;}
  .sub{margin:0;color:var(--muted);font-size:15px;}
  .demo{display:inline-block;margin-top:10px;background:var(--amber-soft2);color:#92400E;border:1.5px solid var(--amber);
    border-radius:6px;padding:4px 10px;font-size:13px;font-weight:700;}
  nav{position:sticky;top:0;z-index:10;display:flex;gap:6px;padding:10px 0;background:var(--bg);margin-top:8px;}
  nav a{text-decoration:none;color:var(--muted);font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;
    background:var(--card);border:1px solid var(--line);}
  nav a:hover{color:var(--accent);border-color:var(--accent);}
  h2{font-family:var(--display);font-size:18px;margin:24px 0 10px;scroll-margin-top:56px;}
  h2 span{font-size:13px;color:var(--faint);font-weight:600;margin-left:6px;}
  img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow-sm);
    margin-bottom:14px;background:var(--card);}
  footer{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--faint);}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← CVS Report Review</a>
  <h1>Telegram Album</h1>
  <p class="sub">Mỗi báo cáo là một album ảnh dọc, gửi qua Telegram mỗi sáng.</p>
  <span class="demo">Demo data</span>

  <nav><a href="#bod">BOD</a><a href="#ops">OPS</a><a href="#cat">CAT</a></nav>

  <h2 id="bod">BOD Snapshot<span>3 ảnh</span></h2>
  <img src="album/CVS_BOD_2026-10-07_1of3.png" alt="BOD 1/3" width="720" height="1280" loading="lazy">
  <img src="album/CVS_BOD_2026-10-07_2of3.png" alt="BOD 2/3" width="720" height="1280" loading="lazy">
  <img src="album/CVS_BOD_2026-10-07_3of3.png" alt="BOD 3/3" width="720" height="1280" loading="lazy">

  <h2 id="ops">OPS Snapshot<span>6 ảnh</span></h2>
  <img src="album/CVS_OPS_2026-10-07_1of6.png" alt="OPS 1/6" width="720" height="1280" loading="lazy">
  <img src="album/CVS_OPS_2026-10-07_2of6.png" alt="OPS 2/6" width="720" height="1280" loading="lazy">
  <img src="album/CVS_OPS_2026-10-07_3of6.png" alt="OPS 3/6" width="720" height="1280" loading="lazy">
  <img src="album/CVS_OPS_2026-10-07_4of6.png" alt="OPS 4/6" width="720" height="1280" loading="lazy">
  <img src="album/CVS_OPS_2026-10-07_5of6.png" alt="OPS 5/6" width="720" height="1280" loading="lazy">
  <img src="album/CVS_OPS_2026-10-07_6of6.png" alt="OPS 6/6" width="720" height="1280" loading="lazy">

  <h2 id="cat">CAT Snapshot<span>7 ảnh</span></h2>
  <img src="album/CVS_CAT_2026-10-07_1of7.png" alt="CAT 1/7" width="720" height="1280" loading="lazy">
  <img src="album/CVS_CAT_2026-10-07_2of7.png" alt="CAT 2/7" width="720" height="1280" loading="lazy">
  <img src="album/CVS_CAT_2026-10-07_3of7.png" alt="CAT 3/7" width="720" height="1280" loading="lazy">
  <img src="album/CVS_CAT_2026-10-07_4of7.png" alt="CAT 4/7" width="720" height="1280" loading="lazy">
  <img src="album/CVS_CAT_2026-10-07_5of7.png" alt="CAT 5/7" width="720" height="1280" loading="lazy">
  <img src="album/CVS_CAT_2026-10-07_6of7.png" alt="CAT 6/7" width="720" height="1280" loading="lazy">
  <img src="album/CVS_CAT_2026-10-07_7of7.png" alt="CAT 7/7" width="720" height="1280" loading="lazy">

  <footer>Số liệu trên các trang là dữ liệu minh họa, không phải số thật của CVS · Cập nhật 08/10/2026</footer>
</div>
</body>
</html>
