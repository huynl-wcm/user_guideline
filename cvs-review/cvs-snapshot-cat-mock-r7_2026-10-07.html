:root{--accent:#2563EB;--pos:#0D9373;--warn:#D97706;--neg:#E03B3B;--negbg:#FDF2F2;--t1:#0F172A;--t2:#475569;--t3:#64748B;--b1:#E2E8F0;--b2:#CBD5E1;--bg:#F8FAFC;--line:#E2E8F0;--card:#FFFFFF;
      --h1:#EEF2FF;--h2:#DBEAFE;--h3:#93C5FD;--wl:230px;--col:120px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);font-family:'Plus Jakarta Sans','SF Pro Display','Segoe UI',sans-serif;font-size:14px;font-weight:500}
.wrap{max-width:1240px;margin:0 auto;padding:12px 16px 32px}
.demo{background:#FEF3C7;color:#92400E;border:1.5px solid var(--warn);border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600;margin-bottom:10px}
header h1{font-size:20px;margin:0;font-weight:700}
header .sub{color:var(--t2);font-size:13px;margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.seg{display:inline-flex;border:1.5px solid var(--b2);border-radius:6px;overflow:hidden;background:var(--card);vertical-align:middle}
.seg button,.seg a{border:0;background:none;padding:6px 10px;font:inherit;font-size:13px;color:var(--t2);cursor:pointer;text-decoration:none}
.seg .on{background:var(--accent);color:#fff}
select{font:inherit;font-size:13px;padding:5px 6px;border:1.5px solid var(--b2);border-radius:6px;background:var(--card)}
h2{font-size:15px;margin:20px 0 6px;font-weight:700}
h2 small{font-weight:500;color:var(--t2);font-size:13px}
.note{font-size:13px;color:var(--t2);margin:-2px 0 6px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.kpi{background:var(--card);border:1.5px solid var(--b1);border-radius:8px;padding:9px 10px}
.kpi .n{color:var(--t2);font-size:13px;font-weight:600}
.kpi .p{color:var(--t3);font-size:13px;margin-top:2px}
.kpi .v{font-size:20px;font-weight:700;margin:1px 0;display:flex;align-items:center;gap:6px}
.kpi .m{font-size:13px;color:var(--t2)}
.kpi .sp{font-size:13px;color:var(--t1);margin-top:4px;background:var(--bg);border-radius:4px;padding:3px 5px}
.kpi .o{font-size:13px;color:var(--t2);margin-top:6px;line-height:1.6;border-top:1.5px solid var(--line);padding-top:5px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.cards{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--card);border:1.5px solid var(--b1);border-left:5px solid var(--neg);border-radius:8px;padding:9px 11px;line-height:1.5}
.card[data-go]{cursor:pointer}.card[data-go]:hover{border-color:var(--accent)}
.card b{font-weight:700}
.card .why{display:block;margin-top:4px}
.card .own{display:inline-block;margin-top:5px;font-size:13px;font-weight:600;color:var(--accent)}
.side{font-size:13px;color:var(--t2);margin-top:6px}.side a{color:var(--accent);cursor:pointer;font-weight:600}
.card .go2{float:right;font-size:13px;color:var(--accent);font-weight:600;margin-left:8px}
.tw{overflow-x:auto;background:var(--card);border:1.5px solid var(--b1);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.45}
table.fx{table-layout:fixed}
table.fx td,table.fx th{overflow:hidden;text-overflow:ellipsis}
table.fx th{white-space:normal}
th,td{padding:9px 10px;border-bottom:1.5px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
td{height:46px;font-weight:500}
th{color:var(--t2);font-weight:600;font-size:13px;background:var(--bg);border-bottom:1.5px solid var(--b2)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1}
tr td{background:var(--card)} tr.alt td{background:#F8FAFC}
tr td.bad,tr.alt td.bad{background:var(--negbg)}
td.bad .c{color:var(--neg)}
.neg{color:var(--neg)}
th:first-child{background:var(--bg)}
td .c{display:inline-flex;align-items:center;gap:5px;font-size:14px;color:var(--t1)}
td .l{display:block;font-size:13px;color:var(--t2)}
.lv0 td:first-child{font-weight:600}
.lv1 td:first-child{padding-left:28px}.lv2 td:first-child{padding-left:44px}.lv3 td:first-child{padding-left:60px}
tr.top td{background:var(--bg)} tr.top td:first-child{font-weight:600}
tr.hot td:first-child{box-shadow:inset 5px 0 0 var(--hc);font-weight:700}
tr.sel td{background:#F1F5F9} tr.sel td:first-child::after{content:' ● selected';color:var(--t2);font-size:13px;font-weight:600}
.tg{cursor:pointer;color:var(--accent);display:inline-block;width:16px}
.unit{cursor:pointer;border-bottom:1.5px dotted var(--b2)}
.hl td{animation:fl 2.4s}@keyframes fl{0%,50%{background:#DBEAFE}}
.go{border:1.5px solid var(--accent);color:var(--accent);background:none;border-radius:4px;font:inherit;font-size:13px;padding:1px 7px;cursor:pointer}
.chip{display:inline-flex;gap:6px;align-items:center;background:#DBEAFE;color:#1D4ED8;border-radius:12px;padding:3px 10px;font-size:13px;font-weight:600}
.chip button{border:0;background:none;color:#1D4ED8;cursor:pointer;font:inherit}
.ebit{background:var(--card);border:1.5px solid var(--b1);border-radius:8px;padding:8px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cols2{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:8px;align-items:start}
.legend{font-size:13px;color:var(--t2);margin:4px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:middle;margin-right:3px;border:1.5px solid var(--b1)}
.foot{margin-top:24px;font-size:13px;color:var(--t2);border-top:1.5px solid var(--b1);padding-top:8px;line-height:1.6}
.hidden{display:none}
table.ph td,table.ph th{padding:8px 4px}table.ph td:first-child,table.ph th:first-child{padding-left:8px;white-space:normal}
table.ph .c{gap:3px}table.ph .dot{width:8px;height:8px}
.xm{cursor:pointer;border-bottom:1.5px dotted var(--b2)}
td[data-c],.kpi .v[data-c]{cursor:pointer}
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px;padding:6px 8px;background:var(--card);border:1.5px solid var(--b1);border-radius:8px}
.fbar .lbl{font-size:13px;color:var(--t2);font-weight:600}
.fbar .back{border:1.5px solid var(--accent);color:var(--accent);background:none;border-radius:6px;font:inherit;font-size:13px;font-weight:600;padding:3px 10px;cursor:pointer;margin-left:auto}
.fbar.hidden{display:none}
td .l{white-space:normal}
#xp{display:none;position:fixed;top:0;right:0;width:360px;height:100vh;background:var(--card);border-left:1.5px solid var(--b2);
    box-shadow:-6px 0 18px rgba(15,23,42,.10);padding:14px 16px 24px;overflow-y:auto;z-index:20;line-height:1.55}
#xp.on{display:block}
#xp h3{font-size:16px;margin:0 28px 6px 0;font-weight:700}
#xp h4{font-size:13px;margin:12px 0 3px;color:var(--t2);font-weight:700}
#xp p{margin:0;font-size:14px}
#xp .x{position:absolute;top:8px;right:10px;border:0;background:none;font:inherit;font-size:20px;color:var(--t2);cursor:pointer}
#xp .cellv{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:700;margin:4px 0}
#xp table{margin-top:4px}#xp td,#xp th{height:auto;padding:5px 6px;text-align:center}#xp th:first-child,#xp td:first-child{position:static}
#xp td.cur{background:var(--h2);font-weight:700}
@media (max-width:860px){.strip{grid-template-columns:repeat(4,1fr)}.cols2{grid-template-columns:1fr}}
@media (max-width:480px){:root{--wl:130px}.wrap{padding:10px 10px 24px}table.fx td:first-child{white-space:normal;text-overflow:clip}.strip{grid-template-columns:repeat(2,1fr)}.kpi .v{font-size:18px}.cards{grid-template-columns:1fr}}
/* khung giải thích trên điện thoại: CSS do khối ui-common tự chèn (#xp-sheet, T27) — một bản cho snapshot, DETAIL, gói A/B */
#xp p+p{margin-top:8px}
.foot{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* T27 — ảnh Telegram: slide DỌC 720×1280 (?slides=1; THAY khổ ngang T26) — cầm điện thoại dọc, ảnh thu ~0,54× ⇒ chữ 20px ≈ 11pt.
   Chữ nhỏ nhất 20px, số KPI 34px, viền 2px; ô ≤ E nền đỏ nhạt + vạch đỏ trái */
html.slides body{background:var(--bg)} html.slides .wrap{display:none}
.slide{width:720px;height:1280px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;padding:16px 20px 12px}
.slide table.fx{table-layout:auto}.slide table.fx td:first-child{white-space:normal;text-overflow:clip;overflow:visible}.slide td .l{white-space:nowrap}
.slide .sh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:20px;color:var(--t2);border-bottom:2px solid var(--b2);padding-bottom:8px}
.slide .sh b{color:var(--t1);font-size:24px;font-weight:700;flex:1 1 auto}
.slide .sh .dm{background:#FEF3C7;color:#92400E;border:2px solid var(--warn);border-radius:6px;padding:0 8px;font-weight:600}
.slide .sh .lg{flex-basis:100%;display:flex;gap:14px;align-items:center}.slide .sh .lg .dot{width:14px;height:14px}
.slide .sh .pg{font-weight:700;color:var(--t1);font-size:24px}
.slide .sb{flex:1;overflow:hidden}
.slide h2{font-size:26px;margin:12px 0 8px;line-height:1.3}.slide h2 small{font-size:20px;display:block;font-weight:500}
.slide .tw,.slide .kpi,.slide .card,.slide .ebit{border-width:2px}
.slide table{font-size:20px}.slide th{font-size:20px;border-bottom-width:2px}.slide th,.slide td{border-bottom-width:2px;padding:8px 10px}
.slide td{height:auto}.slide td .c{font-size:22px}.slide td .l,.slide .l{font-size:20px}.slide .dot{width:14px;height:14px}
.slide table.ph td,.slide table.ph th{padding:8px 6px}.slide table.ph .dot{width:12px;height:12px}.slide table.ph th{white-space:normal;text-align:right}
.slide tr td.bad,.slide tr.alt td.bad{box-shadow:inset 4px 0 0 var(--neg)}

<script id="kb" type="application/json">{"m":{"rev":{"id":"TQ-03","name":"Revenue","gt":"Tổng doanh thu mọi cửa hàng CVS trong kỳ, kèm số cửa hàng hoạt động. Dòng bối cảnh, không drill — với ít cửa hàng, số này chủ yếu phản ánh bao nhiêu cửa hàng đang mở.","ct":"Cộng doanh thu (theo phạm vi doanh thu chuẩn) của mọi cửa hàng CVS; lũy kế tháng so với kế hoạch. Minh họa: kế hoạch tháng 6 tỷ đ, tới ngày 15 lũy kế 2,7 tỷ đ ⇒ đạt 45% kế hoạch khi đã qua 50% số ngày.","subs":{},"dir":"up"},"spd":{"id":"TQ-01","name":"Sales Per Day","gt":"Doanh thu bình quân một cửa hàng làm được trong một ngày hoạt động. Con số đầu tiên đọc mỗi sáng; không phụ thuộc chuỗi đang mở bao nhiêu cửa hàng.","ct":"Tổng doanh thu (theo phạm vi doanh thu chuẩn) chia tổng số ngày hoạt động của các cửa hàng đang xem. Minh họa: 3 cửa hàng, trong 7 ngày có 20 ngày hoạt động, doanh thu 400 tr đ ⇒ Sales Per Day = 20 tr đ.","subs":{},"dir":"up"},"bpd":{"id":"TG-01","name":"Bill Per Day","gt":"Số bill mua hàng bình quân một cửa hàng trong một ngày hoạt động — thước đo traffic (không có đếm người vào cửa, nên bill là lượt khách).","ct":"Tổng số bill mua (bỏ bill trả hàng) chia tổng ngày hoạt động. Minh họa: 2 cửa hàng, 14 ngày hoạt động, 11.200 bill ⇒ 800 bill/cửa hàng/ngày.","subs":{},"dir":"up"},"bs":{"id":"TG-02","name":"Bill Size","gt":"Doanh thu bình quân của một bill — thước đo độ lớn giỏ hàng.","ct":"Doanh thu chia số bill. Minh họa: 20 tr đ doanh thu, 800 bill ⇒ 25.000 đ/bill.","subs":{},"dir":"up"},"mar":{"id":"BS-02","name":"Margin after S&L %","gt":"Front margin còn lại sau khi trừ S&L loại SHRINKAGE và LOSS, tính trên doanh thu. Là số chuỗi convenience tối ưu thật (lãi gộp sau hủy hàng), không phải doanh thu. KHÔNG phải Gross Profit của P&L.","ct":"(Front margin − SHRINKAGE − LOSS) chia doanh thu. Minh họa: doanh thu 20 tr đ, front margin 5 tr đ, SHRINKAGE 0,5 tr đ, LOSS 0,1 tr đ ⇒ (5 − 0,6) / 20 = 22%, tức biên giảm 3 điểm % vì S&L (từ 25% xuống 22%).","subs":{},"dir":"up"},"dr":{"id":"HH-12","name":"DR","gt":"Phần trăm SKU đạt DR trong các SKU được tính DR — đúng chỉ số DR chuỗi đang theo dõi. SKU nào được tính và thế nào là đạt do team cung ứng (SCCT) quy định.","ct":"Số SKU đạt chia số SKU được tính DR, cộng dồn trên mọi cửa hàng và ngày đang xem (cộng số SKU của mọi cửa hàng rồi mới chia, không lấy trung bình tỷ lệ từng cửa hàng). Minh họa: hôm qua cửa hàng được tính 1.000 SKU, 920 SKU đạt ⇒ DR 92%.","subs":{},"dir":"up"},"dio":{"id":"HH-13","name":"DIO","gt":"Giá trị tồn của hàng Core 1–3 đủ bán bao nhiêu ngày theo giá vốn bình quân 30 ngày gần nhất — đúng công thức DIO chuỗi đang dùng. Cao = tồn thừa, chôn vốn; thấp = nguy cơ hết.","ct":"Giá trị tồn hàng Core 1–3 chia giá vốn bình quân một ngày (giá vốn 30 ngày ÷ 30). Minh họa: tồn Core 400 tr đ, giá vốn 30 ngày 300 tr đ (10 tr đ / ngày) ⇒ 40 ngày.","subs":{},"dir":"down"},"split":{"id":"TQ-02","name":"Sales Per Day Gap Split","gt":"Sales Per Day lệch bao nhiêu % so với mốc, trong đó bao nhiêu % do số bill, bao nhiêu do giá trị bill. Hai phần cộng đúng bằng tổng — người xem biết mở A1 (khách) hay A2 (giỏ).","ct":"Chia mức lệch thành phần do số bill và phần do giá trị bill, theo mức đóng góp của từng phần; hai phần luôn cộng đúng bằng tổng. Minh họa: Sales Per Day mốc 20 tr đ, hôm qua 17,6 tr đ (−12%); bill/ngày 800 → 728, giá trị bill 25.000 → 24.176 đ ⇒ −12% = traffic −8,9% + giá trị bill −3,1%.","subs":{},"dir":"up"},"odr":{"id":"TQ-04","name":"Operating Day Rate","gt":"Phần trăm ngày lịch (kể từ ngày khai trương) mà cửa hàng có phát sinh bán. CVS 24/7 kỳ vọng 100%; thấp hơn là cờ, mở danh sách cửa hàng-ngày thiếu.","ct":"Số ngày hoạt động chia số ngày lịch kể từ ngày khai trương (hoặc đầu kỳ, lấy ngày muộn hơn) tới D-1. Minh họa: kỳ 30 ngày, cửa hàng có 29 ngày phát sinh bán ⇒ 96,7% → cờ, hiện ngày bị thiếu.","subs":{},"dir":"up"},"pc":{"id":"KM-05","name":"Promo Compliance","gt":"Chương trình có chạy đúng tại cửa hàng không, tách 2 lỗi: (a) Tuân thủ giá — cặp cửa hàng × SKU trong kế hoạch có bán mà không áp giá KM; (b) Có hàng KM — cặp trong kế hoạch KHÔNG bán và hết tồn, tức hàng KM không về tới cửa hàng (lỗi phổ biến nhất của CT).","ct":"(a) Cặp có bán giá KM chia cặp có bán; (b) cặp không bán và tồn = 0 chia tổng cặp kế hoạch. Minh họa: CT 10 cửa hàng × 20 SKU = 200 cặp; 180 cặp có bán, 171 có giá KM ⇒ (a) 95%; 20 cặp không bán, 14 trong đó tồn = 0 ⇒ (b) 7% cặp không có hàng KM. (b) cao = vấn đề phân bổ / giao hàng (Supply); (a) cao = vấn đề tại cửa hàng (Ops).","subs":{},"dir":"up"},"dp":{"id":"TG-06","name":"Bill Per Day by Daypart","gt":"Traffic của từng ô thứ trong tuần × khung giờ CVS, bình quân một cửa hàng một ngày. Mặc định hiển thị heatmap 7 thứ × 6 khung; soi được tới 24 giờ.","ct":"Số bill trong ô (vd Thứ Bảy, 17–19h) chia số ngày hoạt động rơi vào Thứ Bảy. Minh họa: 4 Thứ Bảy, 2.080 bill khung 17–19h ⇒ 520 bill/cửa hàng/ngày; so với 600 cùng ô của TB cùng model ⇒ ô đỏ.","subs":{},"dir":"up"},"age":{"id":"MR-01","name":"Sales Per Day by Store Age Week","gt":"Sales Per Day của từng cửa hàng ở tuần tuổi thứ n, đặt cạnh các cửa hàng pilot khác cùng tuần tuổi và trung bình 3 model. Là số trả lời sớm nhất câu hỏi số 1 của BLĐ trong pilot (pilot có ổn không, model nào nhân rộng) — P&L sớm nhất cuối 11/2026.","ct":"Doanh thu tuần tuổi n chia số ngày hoạt động của tuần đó, so với các cửa hàng cùng tuần tuổi. Minh họa: tuần tuổi 3, cửa hàng Standard đạt 16 tr đ / ngày, TB 9 cửa hàng ở tuần tuổi 3 là 18 tr đ, TB Standard 17 tr đ ⇒ thấp hơn pilot 11%, thấp hơn model 6%.","subs":{},"dir":"up"},"upt":{"id":"TG-03","name":"UPT","gt":"Bình quân một bill có bao nhiêu món. Tăng UPT là mục tiêu của combo, bố trí kệ mua kèm.","ct":"Tổng số món chia số bill; hàng bán theo cái đếm theo số lượng, hàng cân ký mỗi dòng bill tính 1 món. Minh họa: 800 bill có 2.300 món đếm theo cái và 100 dòng hàng cân ký ⇒ UPT = 2.400 / 800 = 3,0.","subs":{},"dir":"up"},"aip":{"id":"TG-04","name":"Avg Item Price","gt":"Doanh thu bình quân của một món bán ra. Chịu tác động của mix ngành hàng (FF, đồ uống vs hàng khô), giá và khuyến mãi.","ct":"Doanh thu chia tổng số món (cùng cách đếm món của UPT). Minh họa: 20 tr đ doanh thu, 2.400 món ⇒ 8.333 đ/món.","subs":{},"dir":"up"},"bssplit":{"id":"TG-05","name":"Bill Size Gap Split","gt":"Giá trị bill lệch bao nhiêu % so với mốc, trong đó bao nhiêu % do khách lấy ít / nhiều món hơn, bao nhiêu do giá mỗi món. Hai phần cộng đúng bằng tổng.","ct":"Chia mức lệch của giá trị bill thành phần do số món mỗi bill và phần do giá mỗi món, theo mức đóng góp của từng phần; hai phần luôn cộng đúng bằng tổng (cùng cách với TQ-02). Minh họa: bill mốc 25.000 đ, hôm qua 23.000 đ (−8%); UPT 3,0 → 2,85, giá/món 8.333 → 8.070 đ ⇒ −8% = số món −4,9% + giá/món −3,1%.","subs":{"from UPT":"Phần chênh lệch giá trị bill do khách lấy nhiều / ít món hơn mốc. Âm ⇒ khách bỏ bớt món mua kèm: xem combo, bố trí kệ, gợi ý mua thêm. Minh họa: bill thấp hơn mốc 8%, trong đó số món −4,9% ⇒ phần lớn là do khách lấy ít món hơn.","from Avg Item Price":"Phần chênh lệch giá trị bill do giá bình quân mỗi món cao / thấp hơn mốc. Âm ⇒ khách chuyển sang hàng rẻ hơn hoặc khuyến mãi giảm sâu: xem mix ngành và mức giảm giá. Minh họa: bill thấp hơn mốc 8%, trong đó giá mỗi món −3,1%; cộng với phần số món −4,9% vừa đúng −8%."},"dir":"up"},"mix":{"id":"TG-08","name":"Revenue Mix","gt":"Mỗi ngành hàng (MCH) chiếm bao nhiêu % doanh thu. Giải thích vì sao giá trị bill / giá TB mỗi món đổi.","ct":"Doanh thu ngành hàng chia tổng doanh thu. Minh họa: đồ uống 6 tr đ trên 20 tr đ ⇒ 30%.","subs":{},"dir":"up"},"pen":{"id":"TG-09","name":"Penetration %","gt":"Bao nhiêu % bill có ít nhất một món thuộc ngành hàng. Phân biệt ngành hàng kéo khách (có mặt trong nhiều bill) với ngành hàng tạo giá trị.","ct":"Số bill có món thuộc ngành hàng chia tổng số bill của cửa hàng. Minh họa: 800 bill, 240 bill có đồ uống ⇒ 30%.","subs":{},"dir":"up"},"p2w":{"id":"KM-02","name":"Δ% P2W","gt":"Doanh thu / cửa hàng / ngày của các SKU trong chương trình lúc chạy KM so với 2 tuần trước khi KM. Đo chương trình có thật sự kéo thêm doanh thu không.","ct":"(Doanh thu KM / ngày trong kỳ CT − doanh thu / ngày 2 tuần trước) chia doanh thu / ngày 2 tuần trước. Minh họa: SKU trong CT bán 400.000 đ/cửa hàng/ngày lúc KM, 2 tuần trước 250.000 đ ⇒ +60%, chênh +150.000 đ/cửa hàng/ngày.","subs":{},"dir":"up"},"ebit":{"id":"PL-01","name":"EBIT Store","gt":"Lãi cấp cửa hàng sau khấu hao, trước chi phí SSC (Back Office + Head Office). Trả lời \"cửa hàng này tự nuôi được nó chưa\". Hiển thị kèm % doanh thu và waterfall _01 → _13.","ct":"EBITDA Store trừ khấu hao của cửa hàng. Minh họa: doanh thu tháng 600 tr đ, Gross Profit 150 tr đ, OPEX 130 tr đ ⇒ EBITDA Store 20 tr đ; khấu hao 35 tr đ ⇒ EBIT Store −15 tr đ (−2,5% doanh thu).","subs":{},"dir":"up"}},"core7":["rev","spd","bpd","bs","mar","dr","dio"],"ebitKey":"ebit","reports":{"BOD":["BS-02","HH-12","HH-13","PL-01","TG-01","TG-02","TQ-01","TQ-02","TQ-03"],"OPS":["BS-02","HH-12","HH-13","KM-05","MR-01","TG-01","TG-02","TG-06","TQ-01","TQ-02","TQ-03","TQ-04"],"CAT":["BS-02","HH-12","HH-13","KM-02","TG-01","TG-02","TG-03","TG-04","TG-05","TG-08","TG-09","TQ-01","TQ-02","TQ-03"]},"cap":{"odr":100.0,"dr":100.0,"pc":100.0}}</script>

  ST.catUnit = ss.length > 1 ? {...ss[1], and: ss[0]} : ss[0] || null;
}
function sync(push) {
  const qs = '?' + stateQuery(ST, REPORT).toString();
  if (qs === location.search) return;
  try { history[push ? 'pushState' : 'replaceState'](null, '', qs); } catch (err) { /* file:// cũ không cho đổi URL — bỏ qua */ }
}
function applyGo(g) {
  const {open, r, hl, ...rest} = g;
  if (r && r !== REPORT) {
    const st = {...ST, ...RESET(), ...rest, opsPin: !!rest.opsUnit}, p = stateQuery(st, r);
    if (hl) p.set('hl', hl); if (open) p.set('open', open);
    location.href = `${VIEW.links[r]}?${p}`; return false;
  }
  Object.assign(ST, rest);
  if (hl) ST.hl = hl;
  if (open) ST.open[open] = true;
  if (g.opsUnit) { ST.opsPin = true; ST.open['o' + ST.opsAxis + g.opsUnit] = true; ST.hl = 'o' + ST.opsAxis + g.opsUnit; }
  return true;
}


document.addEventListener('click', (e) => {
  if (e.target.closest('[data-xclose]')) return closeXp();
  const x = e.target.closest('[data-c],[data-m],[data-tip]');
  if (x) { e.preventDefault(); return explain(x.dataset.c != null ? {c: +x.dataset.c} : x.dataset.tip != null ? {tip: x.dataset.tip} : {id: x.dataset.m, sub: x.dataset.sub}); }
  const t = e.target.closest('button,[data-t],[data-go],[data-unit]'); if (!t || t.closest('#xp')) return;
  if (t.dataset.go) { if (!applyGo(JSON.parse(t.dataset.go))) return; }
  else if (t.dataset.per) ST.per = t.dataset.per;
  else if (t.dataset.a) ST.axis = t.dataset.a;
  else if (t.dataset.oa) { ST.opsAxis = t.dataset.oa; ST.opsUnit = null; ST.opsPin = false; }
  else if (t.dataset.unit) { ST.opsUnit = t.dataset.unit; ST.opsPin = true; }
  else if (t.dataset.t) ST.open[t.dataset.t] = !ST.open[t.dataset.t];
  else if (t.dataset.x) dropFilter(t.dataset.x);
  else if (t.dataset.back) Object.assign(ST, RESET());
  render(); sync(true);
});
$('scope').addEventListener('change', (e) => { if (REPORT === 'OPS') { ST.opsFilter = e.target.value ? JSON.parse(e.target.value) : null; ST.opsUnit = null; ST.opsPin = false; } else ST.catScope = e.target.value; render(); sync(true); });
window.addEventListener('popstate', () => { readQuery(new URLSearchParams(location.search)); render(); });
if (typeof matchMedia !== 'undefined') matchMedia('(max-width:480px)').addEventListener('change', render);
readQuery(q);
if (q.get('hl')) ST.hl = q.get('hl');
for (const k of (q.get('open') || VIEW.open || '').split(',').filter(Boolean)) ST.open[k] = true;
render();
sync(false);   // bỏ hl / open khỏi URL

// ── Tự kiểm bằng máy (?selftest=1): mở khung cho MỌI nhãn chỉ số + MỌI ô, ghi kết quả vào <script id="selftest"> ──
if (q.get('explain')) {   // mở sẵn khung của một chỉ số (đo khung trượt từ dưới trong iframe 390px)
  explain({id: q.get('explain')});
  const r = $('xp').getBoundingClientRect(), d = document.documentElement.dataset;
  d.xpl = Math.round(r.left); d.xpr = Math.round(r.right);
}
if (q.get('selftest') === '1') {
  const out = {labels: [], cells: {n: 0, plan: 0, planOk: 0, noplan: 0}, texts: []}, seen = new Set(), tx = new Set();
  document.querySelectorAll('[data-m]').forEach(el => {
    const id = el.dataset.m, sb = el.dataset.sub || '', key = id + '|' + sb; if (seen.has(key)) return; seen.add(key);
    explain({id, sub: sb || undefined});
    const t = $('xpb').textContent, m = KBI[id];
    out.labels.push({id, sub: sb, gt: !!m.gt && t.includes(m.gt), ct: !!m.ct && t.includes(m.ct),
                     subOk: !sb || !!((m.subs || {})[sb] && t.includes(m.subs[sb]))});
    tx.add(t);
  });
  CELLS.forEach((c, i) => {
    explain({c: i}); out.cells.n++;
    if (c.m.t && !c.m.blank && c.m.v != null) { out.cells.plan++; out.cells.planOk += document.querySelectorAll('#xp .xms td').length === 4; }
    else out.cells.noplan++;
  });
  closeXp();
  out.texts = [...tx];
  const sc = document.createElement('script'); sc.type = 'application/json'; sc.id = 'selftest';
  sc.textContent = JSON.stringify(out).replace(/</g, '\\u003c'); document.body.appendChild(sc);
}
</script>
<script id="slides">
// ═══ Ảnh Telegram (T26; T27 = khổ DỌC) ═══ ?capture=1&slides=1[&slide=k]: dàn lại ĐÚNG các khối #main vừa render (cùng engine, cùng số) vào
// khung DỌC 720×1280 (cạnh dài 1280 = bản "y" Telegram giữ nguyên, core.telegram.org/api/files). Đo DOM thật: khối / dòng bảng / card tràn ⇒
// slide mới, lặp tiêu đề khối + dòng tiêu đề cột, ghi (i/n); bảng rộng ⇒ tách cột (≤ 5 cột số mỗi phần, lặp cột tên, dòng "Revenue · … (1/2)");
// matrix ≤ 5 đơn vị đã xoay sẵn lúc render (hàng = chỉ số). Slide 1 = Core 7 (lưới 2 cột) + dòng tách Sales Per Day (+ card nếu vừa, không ⇒ slide 2).
// Ghi lên <html>: data-slides, data-over (slide có khối tự nó tràn), data-s1 (slide 1 đủ Core 7), data-cardslide (slide có card đầu tiên),
// data-minfont / data-minfontat (chữ nhỏ nhất đo từ DOM), data-minborder (viền mảnh nhất của khung / bảng).
if (SLIDES) {
  const de = document.documentElement, H = 1280, MAXC = 5;
  de.classList.add('slides');
  const blocks = []; let cur = null;
  for (const el of [...$('main').children]) {
    if (el.tagName === 'H2') { cur = {h: el, els: []}; blocks.push(cur); continue; }
    if (!cur || (el.classList.contains('note') && blocks.length !== 2) || !el.textContent.trim()) continue;   // .note = giải thích ⇒ ⓘ trên HTML, không lên ảnh (trừ 'No … at or below E' của khối card)
    if (el.classList.contains('cols2')) cur.els.push(...[...el.children].flatMap(c => c.classList.contains('tw') ? [c] : [...c.children]));
    else cur.els.push(el);
  }
  const title = (h) => { const c = h.cloneNode(true); c.querySelectorAll('.seg').forEach(x => x.remove());
    const sm = c.querySelector('small'); if (sm) sm.textContent = sm.textContent.split(' · ').filter(t => !/^tap /.test(t.trim())).join(' · ');
    return c.innerHTML; };
  const head = `<b>CVS Daily Snapshot — ${REPORT}</b><span class="pg"></span><i class="br"></i><span>Data to ${DB.meta.as_of} · ${PER_LABEL[ST.per]}</span>${DB.meta.demo ? '<span class="dm">Demo data</span>' : ''}`
    + `<span class="lg">${[['red', '≤ E'], ['amber', '≤ HE'], ['green', '≤ O'], ['blue', '≤ O+'], ['violet', '> O+']].map(([c, t]) => `<span><span class="dot" style="background:${COLORS[c]}"></span> ${t}</span>`).join('')}</span>`;
  const host = document.createElement('div'); document.body.appendChild(host);
  const slides = [], over = [];
  const newSlide = () => { const sec = document.createElement('section'); sec.className = 'slide';
    sec.innerHTML = `<div class="sh">${head}</div><div class="sb"></div>`; host.appendChild(sec); slides.push(sec); return sec.querySelector('.sb'); };
  const full = (sb) => sb.scrollHeight > sb.clientHeight + 1;
  let sb = null, h2 = null, placed = 0;
  const startBlock = (b) => { h2 = document.createElement('h2'); h2.innerHTML = title(b.h); h2.dataset.blk = blocks.indexOf(b); sb.appendChild(h2); placed = 0; };
  const move = (b) => { if (!placed) h2.remove(); sb = newSlide(); startBlock(b); };   // khối chưa có gì trên slide này ⇒ tiêu đề đi theo
  // bảng rộng hơn khung hoặc > 5 cột số ⇒ tách cột: mỗi phần = cột tên + tối đa 5 cột số
  const splitCols = (el) => {
    sb.appendChild(el); const t = el.querySelector('table'), hr = [...t.rows].find(r => r.querySelector('th'));
    const W0 = el.clientWidth, ths = [...hr.cells]; let fit = ths.findIndex(c => c.offsetLeft + c.offsetWidth > W0 + 1); el.remove();
    fit = Math.min(fit < 0 ? ths.length : fit, MAXC + 1);
    if (fit >= ths.length || fit < 2) return [el];
    const n = ths.length - 1, per = Math.ceil(n / Math.ceil(n / (fit - 1)));   // chia ĐỀU (Basket 6 cột ⇒ 3 + 3, không 5 + 1)
    const part = (keep) => { const c = el.cloneNode(true); c.querySelectorAll('col').forEach(x => x.remove());
      [...c.querySelector('table').rows].forEach(r => [...r.cells].forEach((td, j) => { if (j && !keep(j)) td.remove(); })); return c; };
    return [part(j => j <= per), ...splitCols(part(j => j > per))];
  };
  // mỗi phần bọc .pt: dòng "Revenue · … — columns 1/2" (khi tách cột) + chú giải đi kèm bảng (heatmap) — lặp ở mọi slide của phần đó
  const withCaption = (parts, leg) => parts.map((p, i) => {
    const w = document.createElement('div'); w.className = 'pt';
    const names = [...p.querySelector('tr').cells].slice(1).map(c => c.textContent.trim()).filter(Boolean);
    if (parts.length > 1) w.innerHTML = `<div class="cp">${esc(names.join(' · '))} — columns ${i + 1}/${parts.length}</div>`;
    w.appendChild(p); if (leg) w.appendChild(leg.cloneNode(true)); return w; });
  blocks.forEach((b, bi) => {
    if (bi === 0) sb = newSlide();                              // khối 0 + 1 (Core 7 + card) = slide 1; khối sau nối tiếp nếu còn chỗ
    else if (bi >= 2 && slides.length === 1) sb = newSlide();
    startBlock(b);
    for (const [ei, el0] of b.els.entries()) {
      if (el0.classList.contains('legend') && b.els[ei - 1] && b.els[ei - 1].classList.contains('tw')) continue;   // đã đi cùng bảng phía trên
      const el = el0.cloneNode(true);
      el.querySelectorAll('button.go').forEach(x => x.remove());
      const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);   // ảnh không bấm được ⇒ bỏ ⓘ
      for (let t = tw.nextNode(); t; t = tw.nextNode()) t.nodeValue = t.nodeValue.replace(/\s?ⓘ/g, '');
      const sp = el.querySelector('.kpi .sp');                         // dòng tách Sales Per Day: một dòng ngang dưới Core 7
      if (sp) { const kn = sp.closest('.kpi').querySelector('.n').textContent.trim(); sp.remove(); b.spl = `<div class="spl"><b>${kn}</b> ${sp.textContent}</div>`; }
      el.querySelectorAll('.kpi .o br').forEach(x => x.replaceWith(' '));   // Daily · YTD một dòng ⇒ slide 1 còn chỗ cho card
      if (el.classList.contains('cards')) {                            // card: từng thẻ một, thẻ tràn ⇒ slide sau
        const box = () => { const c = el.cloneNode(false); sb.appendChild(c); return c; };
        let c = box(), n = 0;
        for (const k of [...el.children]) {
          c.appendChild(k);
          if (full(sb)) { k.remove(); if (!n) c.remove(); move(b); c = box(); c.appendChild(k); n = 0; if (full(sb)) over.push(slides.length); }
          n++; placed++;
        }
        continue;
      }
      const tb = el.classList.contains('tw') ? el.querySelector('table') : null;
      if (!tb) {
        sb.appendChild(el);
        if (b.spl) { (el.children.length % 2 ? el : sb).insertAdjacentHTML('beforeend', b.spl); b.spl = null; }   // Core 7 lẻ ⇒ dòng tách vào ô trống của lưới
        if (full(sb)) {
          const extra = [el, ...(el.nextElementSibling ? [el.nextElementSibling] : [])]; extra.forEach(x => x.remove());
          move(b); extra.forEach(x => sb.appendChild(x)); if (full(sb)) over.push(slides.length); }
        placed++;
        continue;
      }
      const leg = b.els[ei + 1] && b.els[ei + 1].classList.contains('legend') ? b.els[ei + 1] : null;
      for (const part of withCaption(splitCols(el), leg)) {
        const dr = [...part.querySelector('table').rows].filter(r => !r.querySelector('th'));
        const fresh = () => { const w = part.cloneNode(true), t = w.querySelector('table'); [...t.rows].forEach(r => { if (!r.querySelector('th')) r.remove(); });
          sb.appendChild(w); return t.tBodies[0] || t; };
        let body = fresh(), n = 0;
        for (const r of dr) {
          body.appendChild(r);
          if (full(sb)) {
            r.remove();
            if (!n) body.closest('.pt').remove();   // chưa có dòng nào ⇒ cả bảng sang slide sau
            move(b); body = fresh(); body.appendChild(r); n = 0;
            if (full(sb)) over.push(slides.length);
          }
          n++; placed++;
        }
        const w = body.closest('.tw'); if (w.scrollWidth > w.clientWidth + 1) over.push(slides.length);   // vẫn tràn ngang ⇒ báo
      }
    }
  });
  // (i/n) cho khối chia nhiều slide; số trang tổng
  blocks.forEach((b, bi) => { const hs = [...host.querySelectorAll(`h2[data-blk="${bi}"]`)];
    if (hs.length > 1) hs.forEach((h, i) => { const sm = h.querySelector('small'), t = ` (${i + 1}/${hs.length})`; sm ? sm.insertAdjacentText('beforebegin', t + ' ') : h.insertAdjacentText('beforeend', t); }); });
  slides.forEach((sec, i) => { sec.querySelector('.pg').textContent = `${i + 1}/${slides.length}`; });
  // kiểm bằng máy: chữ nhỏ nhất (mọi đoạn chữ đang hiện trên mọi slide) + viền mảnh nhất
  let mf = 99, at = '', mb = 99;
  slides.forEach((sec, i) => {
    const tw = document.createTreeWalker(sec, NodeFilter.SHOW_TEXT);
    for (let t = tw.nextNode(); t; t = tw.nextNode()) { const p = t.parentElement; if (!t.nodeValue.trim() || !p.getClientRects().length) continue;
      const fs = parseFloat(getComputedStyle(p).fontSize); if (fs < mf) { mf = fs; at = `slide ${i + 1} · ${p.tagName.toLowerCase()}.${p.className} · ${t.nodeValue.trim().slice(0, 24)}`; } }
    for (const e of sec.querySelectorAll('*')) for (const ps of ['::before', '::after']) { const c = getComputedStyle(e, ps);   // chữ sinh bằng CSS (vd ● selected)
      if (/^["'].*[A-Za-z0-9]/.test(c.content) && c.display !== 'none') { const fs = parseFloat(c.fontSize); if (fs < mf) { mf = fs; at = `slide ${i + 1} · ${ps} ${c.content.slice(0, 24)}`; } } }
    for (const e of sec.querySelectorAll('.tw,.kpi,.card,.spl,.ebit,th,td')) { const cs = getComputedStyle(e);
      for (const k of ['Top', 'Right', 'Bottom', 'Left']) { const w = parseFloat(cs['border' + k + 'Width']); if (w > 0 && w < mb) mb = w; } }
  });
  const s1 = slides[0].querySelectorAll('.strip .kpi').length === CORE7.length;
  const cs = slides.findIndex(sec => sec.querySelector('.card'));
  const k = +q.get('slide');
  if (k) slides.forEach((sec, i) => { sec.style.display = i + 1 === k ? '' : 'none'; });
  Object.assign(de.dataset, {slides: slides.length, over: over.join(',') || 'none', s1: s1 ? 'ok' : 'no', cardslide: cs + 1, minfont: mf, minfontat: at,
    minborder: mb, h: k ? H : slides.length * H});
  document.body.style.margin = '0';
}
