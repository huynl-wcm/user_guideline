:root{
  --blue:#1F5BD9;--blue-ink:#143E9E;--blue-t:#E9F0FD;
  --orange:#F26A1B;--orange-ink:#B8470A;--orange-t:#FDEBDD;
  --nude:#F6EEE4;--nude-2:#EADCCB;--nude-ink:#8A6A4F;
  --ink:#1B2232;--ink2:#5A6273;--ink3:#8A90A0;--line:#EFE7DC;--card:#FFFFFF;
  --ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box}
body{margin:0;background:#FBF8F4;color:var(--ink);font-family:'Plus Jakarta Sans','SF Pro Display','Segoe UI',sans-serif;font-size:14px;font-weight:500;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.page{max-width:880px;margin:0 auto;padding:20px 16px 110px}
.view{animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.demo{display:inline-block;background:#FFF3D6;color:#8A5A00;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.m-Flagship{background:var(--orange-t);color:var(--orange-ink)}
.m-Standard{background:var(--blue-t);color:var(--blue-ink)}
.m-Mini{background:var(--nude);color:var(--nude-ink)}
/* checkpoint rail — dùng chung 2 version */
.rail{display:flex;gap:6px;align-items:center}
.rail .cp{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:999px}
.rail .cp i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.45}
.rail .ln{flex:1;height:2px;min-width:12px;border-radius:2px}

/* ================= VERSION A — Ledger (giữ khung mock r8–r12, đổi màu) ================= */
.A .band{background:var(--blue);color:#fff;border-radius:22px;padding:20px 22px 18px;position:relative;overflow:hidden}
.A .band::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07)}
.A .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:rgba(255,255,255,.8);font-weight:600}
.A .hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-top:14px}
.A .when b{display:block;font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.A .when span{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-top:8px;color:rgba(255,255,255,.78);font-weight:700}
.A .kpis{display:flex;gap:8px;flex-wrap:wrap}
.A .kpi{background:rgba(255,255,255,.12);border-radius:14px;padding:9px 14px;min-width:104px}
.A .kpi .n{font-size:12px;color:rgba(255,255,255,.75);font-weight:600}
.A .kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.A .kpi.hl{background:var(--orange)}
.A .kpi.hl .n{color:rgba(255,255,255,.9)}
.A .rail{margin-top:16px}
.A .rail .cp{color:rgba(255,255,255,.6)} .A .rail .ln{background:rgba(255,255,255,.22)}
.A .rail .cp.done{color:#fff} .A .rail .ln.done{background:rgba(255,255,255,.7)}
.A .rail .cp.on{background:#fff;color:var(--blue-ink)} .A .rail .cp.on i{opacity:1;background:var(--orange)}
.A .shell{margin-top:14px;background:var(--nude);border-radius:22px;padding:6px}
.A .core{background:var(--card);border-radius:16px;overflow-x:auto;box-shadow:0 1px 2px rgba(138,106,79,.08)}
.A table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.A th{font-size:12px;font-weight:700;color:var(--ink2);text-align:right;padding:12px 12px 10px;border-bottom:1.5px solid var(--nude-2);white-space:nowrap;vertical-align:bottom}
.A th small{display:block;font-weight:600;color:var(--ink3);font-size:11px;margin-top:2px}
.A td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.A th.l,.A td.l{text-align:left}
.A tr.tot td{background:#FFF8F0;font-weight:800;border-bottom:1.5px solid var(--nude-2)}
.A tr.brk td{border-top:1.5px solid var(--nude-2)}
.A td.id{color:var(--ink2);font-weight:600}
.A .pc{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.A .pc .tr{width:110px;height:8px;border-radius:8px;background:var(--orange-t);overflow:hidden}
.A .pc .tr i{display:block;height:100%;border-radius:8px;background:var(--orange);transform-origin:left;animation:grow .9s var(--ease) both}
.A .pc b{min-width:44px;font-weight:800}
.A .pc.hit b{color:var(--orange-ink)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.foot{margin-top:12px;font-size:12px;color:var(--ink2);line-height:1.6}
.foot b{color:var(--ink)}

/* ================= VERSION B — Board (nude nền, cam header, mỗi store một làn thanh) ================= */
.B{background:var(--nude);border-radius:26px;padding:6px}
.B .in{background:#FFFCF8;border-radius:21px;padding:20px 20px 16px}
.B .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.B .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--orange)}
.B h1{font-size:22px;margin:4px 0 0;font-weight:800;letter-spacing:-.02em}
.B h1 span{color:var(--ink3);font-weight:600}
.B .hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin-top:18px;background:var(--orange);color:#fff;border-radius:18px;padding:18px 20px}
.B .big b{display:block;font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:.95}
.B .big span{display:block;font-size:12px;font-weight:700;margin-top:6px;color:rgba(255,255,255,.88)}
.B .hs{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:rgba(255,255,255,.85);font-weight:600}
.B .hs b{display:block;font-size:20px;color:#fff;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.B .rail{margin-top:14px}
.B .rail .cp{color:rgba(255,255,255,.62)} .B .rail .ln{background:rgba(255,255,255,.28)}
.B .rail .cp.done{color:#fff} .B .rail .ln.done{background:rgba(255,255,255,.8)}
.B .rail .cp.on{background:#fff;color:var(--orange-ink)} .B .rail .cp.on i{opacity:1;background:var(--blue)}
.B .head{display:grid;grid-template-columns:96px 1fr 128px;gap:12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:800;padding:18px 6px 8px}
.B .head .r{text-align:right}
.B .lane{display:grid;grid-template-columns:96px 1fr 128px;gap:12px;align-items:center;padding:9px 6px;border-top:1px solid var(--line)}
.B .lane .chip{justify-self:start}
.B .lane.brk{border-top:1.5px solid var(--nude-2);margin-top:6px}
.B .st{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
.B .st em{font-style:normal;color:var(--ink3);font-weight:600;font-size:12px}
.B .tr{height:10px;border-radius:10px;background:var(--nude);position:relative;overflow:hidden}
.B .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:10px;background:var(--blue);transform-origin:left;animation:grow .9s var(--ease) both}
.B .lane.hit .tr i{background:var(--orange)}
.B .vals{text-align:right;line-height:1.25}
.B .vals b{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em}
.B .lane.hit .vals b{color:var(--orange-ink)}
.B .vals span{font-size:12px;color:var(--ink2);font-weight:600}
.B .foot{padding:0 6px}

/* thanh prototype */
.pbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:6px;display:flex;gap:6px;align-items:center;box-shadow:0 18px 40px -12px rgba(27,34,50,.45);z-index:10;font-size:13px;max-width:calc(100vw - 24px);overflow-x:auto}
.pbar .lb{padding:0 6px 0 10px;color:rgba(255,255,255,.55);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.pbar .sg{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.pbar button{border:0;background:none;color:rgba(255,255,255,.7);font:inherit;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .4s var(--ease),color .4s var(--ease)}
.pbar button.on{background:#fff;color:var(--ink)}
.pbar button:active{transform:scale(.97)}
html.nobar .pbar{display:none}

@media (max-width:560px){
  .A .when b{font-size:36px}.A .kpi{min-width:0;flex:1}.A .kpi .v{font-size:18px}
  .B .hero{grid-template-columns:1fr;gap:12px}.B .big b{font-size:46px}
  .B .head{display:none}.B .lane{grid-template-columns:1fr 104px;row-gap:6px}.B .lane .chip{grid-column:1/-1;justify-self:start}
  .rail .cp{padding:3px 7px;font-size:11px}
}
</style>
</head>

const SNAP = {
  '06': {label: '06:00', range: '0h → 6h'},
  '14': {label: '14:00', range: '0h → 14h'},
  '22': {label: '22:00', range: '0h → 22h'},
  '24': {label: '24:00', range: '0h → 24h · day close'},
};
const KEYS = ['06', '14', '22', '24'];  // khai báo tay: Object.keys đẩy '06' xuống cuối
const noise = (i, k) => (((i * 37 + k * 11) % 7) - 3) / 100;  // ±3%, cố định

function rows(t) {
  const k = KEYS.indexOf(t);
  return STORES
    .map(([id, name, model, target, f], i) => {
      const sales = Math.round(target * CURVE[t] * f * (1 + noise(i, k)) * 10) / 10;
      return {id, name, model, target, sales, pct: sales / target};
    })
    .sort((a, b) => MODELS.indexOf(a.model) - MODELS.indexOf(b.model) || a.id.localeCompare(b.id));
}
const f1 = v => v.toLocaleString('en-US', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const pc = (v, d = 0) => (v * 100).toFixed(d) + '%';
const w = v => Math.min(v, 1) * 100 + '%';

function rail(t) {
  const k = KEYS.indexOf(t);
  return '<div class="rail">' + KEYS.map((x, i) =>
    (i ? `<span class="ln ${i <= k ? 'done' : ''}"></span>` : '') +
    `<span class="cp ${i < k ? 'done' : i === k ? 'on' : ''}"><i></i>${SNAP[x].label}</span>`).join('') + '</div>';
}
function totals(R) {
  const s = R.reduce((a, r) => a + r.sales, 0), g = R.reduce((a, r) => a + r.target, 0);
  return {s, g, p: s / g, hit: R.filter(r => r.pct >= 1).length};
}
const FOOT = t => `<div class="foot"><b>Sales</b> = ${SNAP[t].range.replace(' · day close', '')}, excl. VAT · <b>Target</b> = full day 0h → 24h, excl. VAT · <b>Sales / Target</b> = Sales ÷ full-day Target · Million VND · Stores sorted by model, then store code.</div>`;

function viewA(t) {
  const R = rows(t), T = totals(R), s = SNAP[t];
  let prev = '';
  const body = R.map(r => {
    const brk = prev && prev !== r.model; prev = r.model;
    return `<tr class="${brk ? 'brk' : ''}"><td class="l"><span class="chip m-${r.model}">#${r.model}</span></td>
      <td class="l id">${r.id}</td><td class="l">${r.name}</td>
      <td class="num">${f1(r.sales)}</td><td class="num">${f1(r.target)}</td>
      <td><div class="pc ${r.pct >= 1 ? 'hit' : ''}"><span class="tr"><i style="width:${w(r.pct)}"></i></span><b class="num">${pc(r.pct)}</b></div></td></tr>`;
  }).join('');
  return `<div class="A view">
    <div class="band">
      <div class="top"><span>CVS Sales Snapshot · ${DATE}</span><span class="demo">Demo data</span></div>
      <div class="hero">
        <div class="when"><b>${s.label}</b><span>Sales ${s.range}</span></div>
        <div class="kpis">
          <div class="kpi"><div class="n">Sales</div><div class="v num">${f1(T.s)}</div></div>
          <div class="kpi"><div class="n">Target</div><div class="v num">${f1(T.g)}</div></div>
          <div class="kpi hl"><div class="n">Sales / Target</div><div class="v num">${pc(T.p, 1)}</div></div>
        </div>
      </div>
      ${rail(t)}
    </div>
    <div class="shell"><div class="core"><table>
      <thead><tr><th class="l">Model</th><th class="l">Store</th><th class="l">Store name</th>
        <th>Sales<small>${s.range.replace(' · day close', '')} · excl. VAT</small></th>
        <th>Target<small>full day · excl. VAT</small></th><th>Sales / Target</th></tr></thead>
      <tbody><tr class="tot"><td class="l" colspan="3">Total · ${R.length} stores</td>
        <td class="num">${f1(T.s)}</td><td class="num">${f1(T.g)}</td>
        <td><div class="pc"><span class="tr"><i style="width:${w(T.p)}"></i></span><b class="num">${pc(T.p, 1)}</b></div></td></tr>
      ${body}</tbody></table></div></div>
    ${FOOT(t)}</div>`;
}

function viewB(t) {
  const R = rows(t), T = totals(R), s = SNAP[t];
  let prev = '';
  const lanes = R.map(r => {
    const brk = prev && prev !== r.model; prev = r.model;
    return `<div class="lane ${brk ? 'brk' : ''} ${r.pct >= 1 ? 'hit' : ''}">
      <span class="chip m-${r.model}">#${r.model}</span>
      <div><div class="st">${r.name}<em>${r.id}</em></div><div class="tr"><i style="width:${w(r.pct)}"></i></div></div>
      <div class="vals"><b class="num">${pc(r.pct)}</b><span class="num">${f1(r.sales)} / ${f1(r.target)}</span></div></div>`;
  }).join('');
  return `<div class="B view"><div class="in">
    <div class="top"><div><div class="eyebrow">CVS Sales Snapshot</div><h1>${s.label} <span>· ${DATE}</span></h1></div><span class="demo">Demo data</span></div>
    <div class="hero">
      <div class="big"><b class="num">${pc(T.p, 1)}</b><span>of today's target · Sales ${s.range}</span></div>
      <div><div class="hs"><div>Sales<b class="num">${f1(T.s)}</b></div><div>Target (full day)<b class="num">${f1(T.g)}</b></div><div>Stores at ≥ 100%<b class="num">${T.hit} / ${R.length}</b></div></div>${rail(t)}</div>
    </div>
    <div class="head"><span>Model</span><span>Store</span><span class="r">Sales / Target</span></div>
    ${lanes}
    ${FOOT(t)}</div></div>`;
}

// ── thanh prototype: ?v=A|B · ?t=06|14|22|24 · ?bar=0
const q = new URLSearchParams(location.search);
let V = q.get('v') === 'B' ? 'B' : 'A', TT = KEYS.includes(q.get('t')) ? q.get('t') : '14';
if (q.get('bar') === '0') document.documentElement.classList.add('nobar');
function render() {
  document.getElementById('app').innerHTML = V === 'A' ? viewA(TT) : viewB(TT);
  const b = (k, val, txt) => `<button data-${k}="${val}" class="${(k === 'v' ? V : TT) === val ? 'on' : ''}">${txt}</button>`;
  document.getElementById('pbar').innerHTML =
    `<span class="lb">Prototype</span><div class="sg">${b('v', 'A', 'A · Ledger')}${b('v', 'B', 'B · Board')}</div>` +
    `<div class="sg">${KEYS.map(k => b('t', k, SNAP[k].label)).join('')}</div>`;
  const u = new URL(location); u.searchParams.set('v', V); u.searchParams.set('t', TT); history.replaceState(null, '', u);
}
document.getElementById('pbar').addEventListener('click', e => {
  const x = e.target.closest('button'); if (!x) return;
  if (x.dataset.v) V = x.dataset.v; if (x.dataset.t) TT = x.dataset.t; render();
});
render();
</script>
</body>
</html>
